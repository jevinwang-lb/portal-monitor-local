apiVersion: batch/v1
kind: CronJob
metadata:
  name: portal-monitor
  namespace: portal-monitor

spec:
  # 00:00 / 06:00 / 12:00 / 18:00 Asia/Shanghai
  schedule: "0 */6 * * *"
  timeZone: Asia/Shanghai

  concurrencyPolicy: Forbid

  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600

      template:
        metadata:
          labels:
            app: portal-monitor

        spec:
          restartPolicy: Never

          imagePullSecrets:
            - name: dockerhub

          containers:
            - name: portal-monitor

              # Replaced by CD: sed IMAGE_PLACEHOLDER
              image: IMAGE_PLACEHOLDER

              imagePullPolicy: IfNotPresent

              env:
                - name: DOMAINS_FILE
                  value: /app/domains.txt

                - name: STATE_FILE
                  value: /data/status.json

                - name: LOOKUP_VERIFY_TLS
                  value: "true"

                - name: WEBHOOK_VERIFY_TLS
                  value: "true"

                - name: PYTHONUNBUFFERED
                  value: "1"

                - name: MAX_RETRIES
                  value: "2"

                - name: WEBRISK_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: portal-monitor-webrisk
                      key: api-key

                - name: ALERT_WEBHOOK_URL
                  valueFrom:
                    secretKeyRef:
                      name: portal-monitor-alert
                      key: webhook-url

              volumeMounts:
                - name: domains
                  mountPath: /app/domains.txt
                  subPath: domains.txt
                  readOnly: true

                - name: state
                  mountPath: /data

              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"

                limits:
                  cpu: "500m"
                  memory: "256Mi"

          volumes:
            - name: domains
              configMap:
                name: portal-monitor-config

            - name: state
              persistentVolumeClaim:
                claimName: portal-monitor-state