apiVersion: batch/v1
kind: Job
metadata:
  name: portal-monitor-test
  namespace: portal-monitor

spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 600

  template:
    metadata:
      labels:
        app: portal-monitor-test

    spec:
      restartPolicy: Never

      imagePullSecrets:
        - name: dockerhub

      containers:
        - name: portal-monitor

          # Replaced by CD: sed IMAGE_PLACEHOLDER
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: Always

          env:
            - name: DOMAINS_FILE
              value: /app/domains.txt

            - name: STATE_FILE
              value: /data/status.json

            - name: LOOKUP_VERIFY_TLS
              value: "true"

            - name: WEBHOOK_VERIFY_TLS
              value: "true"

            - name: FAIL_ON_ERROR
              value: "true"

            - name: PYTHONUNBUFFERED
              value: "1"

            - name: MAX_RETRIES
              value: "2"

            - name: WEBRISK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: portal-monitor-webrisk
                  key: api-key

            - name: ALERT_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: portal-monitor-alert
                  key: webhook-url

          volumeMounts:
            - name: domains
              mountPath: /app/domains.txt
              subPath: domains.txt
              readOnly: true

            - name: state
              mountPath: /data

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"

            limits:
              cpu: "500m"
              memory: "256Mi"

      volumes:
        - name: domains
          configMap:
            name: portal-monitor-config-test

        - name: state
          persistentVolumeClaim:
            claimName: portal-monitor-state-test
